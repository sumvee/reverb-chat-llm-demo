server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Reverb WebSocket, same-origin. The browser's Echo client connects to
    # ws://localhost:8091/app/... and this proxies it to the reverb service on
    # :8080 with the Upgrade/Connection headers a WS handshake needs. WITHOUT
    # this the page loads fine over HTTP and messages simply never arrive -- a
    # silent failure. Reverb also exposes /apps/ for its auth/stats endpoints.
    location ~ ^/(app|apps)/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # The theme ships ~58MB of assets and each page pulls dozens in parallel.
    # nginx serving those directly, never touching PHP, is why this isn't
    # `php artisan serve`.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 20m;
    access_log off;
}
